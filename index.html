<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stylesheet/style.css">
</head>
<body>
    <main class="main">
        <div class="main__hangman">
            <div class="hangman__suggestion-box">
                Suggestion
            </div>
            <div class="hangman__blanks"></div>
            <div class="hangman__keyboard">
                <div class="keyboard__row-1">
                    <button class="hangman__keyboard-buttons-style" value="Q">Q</button>
                    <button class="hangman__keyboard-buttons-style" value="W">W</button>
                    <button class="hangman__keyboard-buttons-style" value="E">E</button>
                    <button class="hangman__keyboard-buttons-style" value="R">R</button>
                    <button class="hangman__keyboard-buttons-style" value="T">T</button>
                    <button class="hangman__keyboard-buttons-style" value="Y">Y</button>
                    <button class="hangman__keyboard-buttons-style" value="U">U</button>
                    <button class="hangman__keyboard-buttons-style" value="I">I</button>
                    <button class="hangman__keyboard-buttons-style" value="O">O</button>
                    <button class="hangman__keyboard-buttons-style" value="P">P</button>
                </div>
                <div class="keyboard__row-2">
                    <button class="hangman__keyboard-buttons-style" value="A">A</button>
                    <button class="hangman__keyboard-buttons-style" value="S">S</button>
                    <button class="hangman__keyboard-buttons-style" value="D">D</button>
                    <button class="hangman__keyboard-buttons-style" value="F">F</button>
                    <button class="hangman__keyboard-buttons-style" value="G">G</button>
                    <button class="hangman__keyboard-buttons-style" value="H">H</button>
                    <button class="hangman__keyboard-buttons-style" value="J">J</button>
                    <button class="hangman__keyboard-buttons-style" value="K">K</button>
                    <button class="hangman__keyboard-buttons-style" value="L">L</button>
                </div>
                <div class="keyboard__row-3">
                    <button class="hangman__keyboard-buttons-style" value="Z">Z</button>
                    <button class="hangman__keyboard-buttons-style" value="x">X</button>
                    <button class="hangman__keyboard-buttons-style" value="C">C</button>
                    <button class="hangman__keyboard-buttons-style" value="V">V</button>
                    <button class="hangman__keyboard-buttons-style" value="B">B</button>
                    <button class="hangman__keyboard-buttons-style" value="N">N</button>
                    <button class="hangman__keyboard-buttons-style" value="M">M</button>
                </div>
            </div>
            <button id="start-btn" value="start-btn">Start</button>
        </div>
        <div class="main__draw-hangman">
            draw hangman
        </div>
    </main>

    <script type="module" src="scripts/index.ts"></script>
</body>
</html>
